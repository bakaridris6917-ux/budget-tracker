<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Budget Tracker</title>
 <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>My Budget Tracker</h1>
    </header>
    <main>
        <section id="budget-form">
            <h2>Add a New Expense</h2>
            <form id="expense-form">
                <label for="expense-name">Expense Name:</label>
                <input type="text" id="expense-name" name="expense-name" required>

                <label for="expense-amount">Amount:</label>
                <input type="number" id="expense-amount" name="expense-amount" required>

                <button type="submit">Add Expense</button>
            </form>
        </section>

        <section id="expenses-list">
            <h2>Expenses</h2>
            <ul id="expenses"></ul>
        </section>

        <section id="budget-summary">
            <h2>Budget Summary</h2>
            <p>Total Expenses: $<span id="total-expenses">0.00</span></p>
        </section>
</body>
</html>
